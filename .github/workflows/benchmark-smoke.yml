# =============================================================================
# benchmark-smoke — retrieval 스모크(§34.3)의 CI 회로 **활성판**(T5-3 G1c · 09-06)
#
# 골격이었던 이유(G1b 전)는 seed 가 컨테이너 cp 를 전제해 러너에서 적재가 성립하지 않는
# 것이었다. #863 이 그 벽을 없앴다 — `\copy` 가 구워진 경로를 러너에 «실재하게» 만드는
# 방식이라 load.sql 은 그대로다. 그래서 이제 실제로 잰다.
#
# ## 이 회로가 한 무대에서 «두 번» 재는 이유
#
# 색인 «전»과 «후»를 **같은 컨테이너·같은 DB·같은 모델·같은 러너**에서 연달아 잰다.
# 그러면 두 실행 사이의 변수는 **색인 하나뿐**이다 — 초록이 「무대가 좋아서」가 아니라
# 「색인이 있어서」임을 그 대비가 증명한다. 순서를 뒤집으면(색인 먼저) 대조군을 만들려고
# 색인을 지워야 하고, 그건 다른 상태를 만든 것이지 대조가 아니다.
#
#   1) 색인 0 → 러너 **exit 7**(「색인 없음」) 기대  ← 골격 시절 델타표의
#      «E2 코드축» 행을 여기서 **E1 로 승격**한다.
#   2) 색인 후 → 러너 **exit 0** + hit 계수
#
# 🔴 `/health` 는 판정선이 아니다. neo4j 를 안 띄우므로 그 축은 항상 not-ok 이고,
#    그래도 앱은 선다(lifespan: 「여는 데 실패해도 부팅은 성립한다」). vector·hybrid 는
#    postgres 만 쓴다(`retrieval/service.py:47` — neo4j 는 graphrag 전용). 판정은
#    **러너 rc + hit 계수**로 한다. health 본문은 로그에 참고로만 남긴다.
#
# 🔴 `--gate` 는 주지 않는다(#852 별건). 이 job 은 «보고»이지 회귀 판정선이 아니다.
# =============================================================================
name: benchmark-smoke

on:
  workflow_dispatch:
  push:
    branches: [develop]

permissions:
  contents: read

env:
  # 러너와 컨테이너가 **같은 HF 캐시**를 본다 — 안 묶으면 e5-small 을 두 번 받는다
  # (indexer 가 한 번, ai-api warm-up 이 또 한 번).
  HF_HOME: ${{ github.workspace }}/.hf
  API_PORT: '8000'

jobs:
  benchmark-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fkt
          POSTGRES_PASSWORD: fkt_local_dev
          POSTGRES_DB: fkt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fkt -d fkt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: fkt
      PGPASSWORD: fkt_local_dev
      PGDATABASE: fkt
      FKT_POSTGRES_DSN: postgresql://fkt:fkt_local_dev@127.0.0.1:5432/fkt
      # 🔴 이 회로에는 LLM 이 없다 — 그래서 «측정 모델» 칸에 모델명을 넣지 않는다.
      #    그 칸이 답하는 질문은 「누가 재나」이고, 여기서 잰 것은 무인 러너다. 실행 주체를
      #    그대로 적으면 산출물을 나중에 집어든 사람이 그 run 으로 돌아갈 수도 있다.
      FKT_MEASURE_MODEL: ci:github-actions run ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: runner tools exist (pwsh · psql · pg_isready · docker · node)
        run: |
          set -euo pipefail
          for t in pwsh psql pg_isready docker node; do
            command -v "$t" >/dev/null || { echo "::error::${t} 없음 — 이 회로가 성립하지 않는다"; exit 1; }
          done
          echo "pwsh $(pwsh --version) · $(psql --version) · node $(node --version) · docker $(docker --version)"
          pg_isready -d "$PGDATABASE" -U "$PGUSER"

      # 🔴 구조 가드 갈래 드릴 — 실무대(색인 0)로는 exit 5·8·9 를 손잡이 하나로 갈라 세울 수
      #    없다(색인을 비우면 두 축이 함께 움직인다). 반쪽 스텁으로 «한 번에 한 칸»만 바꿔
      #    러너의 판정식이 실제로 갈리는지 «매 run» 센다. 이게 없으면 exit 8·9 는 이 회로에서
      #    자극 0건이라 「넣었다」만 남고 동작 증명이 없다. postgres·모델·색인 전부 불필요.
      - name: 구조 가드 갈래 드릴 (exit 0·2·5·6·7·8·9 가 실제로 갈리는가)
        run: |
          set -euo pipefail
          rc=0
          node benchmarks/tools/smoke-runner-branch-drill.mjs > /tmp/drill.txt 2>&1 || rc=$?
          cat /tmp/drill.txt
          [ "$rc" -eq 0 ] || { echo "::error::갈래 드릴 rc ${rc} — 구조 가드가 기대대로 갈리지 않는다"; exit 1; }
          # 🔴 「초록 ≠ 훑음」 — 열 수를 세어 드릴이 «실제로 돌았는지» 확인한다. 0칸 PASS 는 PASS 가 아니다.
          # 🔴 계수 단위 = «판정이 찍힌 행»(구조 가드 8열 + 쓰기 실패 2열 = 10). 행 끝 앵커를 쓰면
          #    쓰기 실패 2열이 뒤에 사유를 달고 있어 8 이 나온다 — 앵커 없이 센다(실측 확인).
          cols=$(grep -cE '\| (PASS|🔴 FAIL)' /tmp/drill.txt || true)
          [ "$cols" -eq 10 ] || { echo "::error::드릴 판정 행 ${cols} ≠ 10 — 드릴이 안 돌았거나 열이 바뀌었다"; exit 1; }
          echo "드릴 열 ${cols}칸 전건 PASS"

      - name: cache pip (indexer)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-indexer-${{ runner.os }}-${{ hashFiles('services/indexer/requirements.txt') }}

      # 🔴 **CPU 전용 인덱스**를 반드시 준다. 기본 PyPI 의 리눅스 torch 휠은 CUDA 런타임을
      #    함께 끌고 와 수 GB 가 늘어난다 — ai-api Dockerfile 이 같은 이유로 같은 플래그를 쓴다.
      # 🔴 시간·용량을 «잰다». 이 회로에서 가장 비싼 자리가 어디인지 모르면 다음 대가
      #    엉뚱한 곳을 줄인다.
      - name: install indexer deps (CPU wheels · 시간·용량 실측)
        run: |
          set -euo pipefail
          t0=$(date +%s)
          python -m pip install --disable-pip-version-check --quiet \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -r services/indexer/requirements.txt
          t1=$(date +%s)
          echo "설치 $((t1 - t0))s"
          python -c "import torch, sentence_transformers; print('torch', torch.__version__, '· st', sentence_transformers.__version__)"
          du -sh "$(python -c 'import site; print(site.getsitepackages()[0])')" || true

      - name: cache HF model (e5-small)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.hf
          key: hf-intfloat-multilingual-e5-small-v1

      - name: generate seed (stdlib only)
        run: python -m data.generators.generate

      - name: migrate (libpq direct)
        run: pwsh -NoProfile -File services/ai-api/db/migrate.ps1 -Direct

      - name: seed (libpq direct)
        run: pwsh -NoProfile -File data/seed.ps1 -SkipGenerate -Direct

      - name: build ai-api image
        run: docker build -t fkt-ai-api:bench-${{ github.sha }} services/ai-api

      # 🔴 「빌드가 rc 0 을 냈다」와 「이미지가 있다」는 다른 사실이다(replay-e2e-smoke 와 같은 규율).
      - name: image exists
        run: docker image inspect fkt-ai-api:bench-${{ github.sha }} --format 'image id={{.Id}} · size={{.Size}} bytes'

      # --network host = 서비스 컨테이너가 러너 호스트에 매단 5432 로 그대로 간다.
      # /models 마운트 = 러너가 받은(또는 캐시에서 복원한) 모델을 컨테이너가 다시 안 받는다.
      # 이미지의 사용자는 uid 10001 이라 호스트 디렉터리에 쓰기 권한을 열어 준다.
      - name: run ai-api (network host · shared HF cache)
        run: |
          set -euo pipefail
          mkdir -p "$HF_HOME"
          chmod -R 777 "$HF_HOME"
          docker run -d --name fkt-bench --network host \
            -e FKT_POSTGRES_DSN="$FKT_POSTGRES_DSN" \
            -e FKT_BUILD_SHA=${{ github.sha }} \
            -e HF_HOME=/models \
            -v "$HF_HOME:/models" \
            fkt-ai-api:bench-${{ github.sha }}
          for i in $(seq 1 60); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' "http://127.0.0.1:${API_PORT}/api/health" || true)
            [ "$code" != "000" ] && { echo "응답 시작 ${i}회차 · http ${code}"; break; }
            sleep 2
          done
          echo "--- /api/health (참고 · 판정선 아님 · neo4j 는 안 띄웠다) ---"
          cat /tmp/health.json || true; echo

      # ============================ 대조군 (색인 «전») ============================
      # 🔴 O-54 반영(#868): 색인 0 은 이제 **exit 7**(「색인 없음」)이다 — 서버가 503
      #    `index_unavailable` 로 «부재를 이름으로» 말하고, 러너가 그 일관성을 보고 5(검색이
      #    죽었다)와 갈라 준다. 앞판은 둘을 한 코드로 덮어 빨강을 보고도 어디를 고칠지 알 수 없었다.
      # 🔴 러너가 **가드 «앞»에서 `--out` 을 쓰므로**(#868) 빨강에서도 봉투가 파일로 남는다.
      #    그래서 두 번째 계측기(control_status_probe.py)는 이 커밋에서 **제거**했다 —
      #    원 호출의 봉투를 러너가 직접 내주는데 옆에서 같은 질문을 또 사는 것은 비용만 두 배다.
      #    (그 계측기가 낸 값 = evidence/t5-3-g1c-verification.md 에 이미 남아 있다.)
      - name: 대조군 — 색인 0 에서 스모크 (exit 7 = 「색인 없음」이어야 정상)
        run: |
          set -uo pipefail
          chunks=$(psql -tAc "SELECT count(*) FROM document_chunk")
          echo "document_chunk = ${chunks} (색인 전이라 0 이어야 한다)"
          [ "$chunks" = "0" ] || { echo "::error::색인 전인데 chunk ${chunks}행 — 대조군이 성립하지 않는다"; exit 1; }
          rc=0
          node benchmarks/run-benchmark-smoke.mjs --base "http://127.0.0.1:${API_PORT}" --k 5             --out /tmp/ctrl.json > /tmp/ctrl.txt 2>&1 || rc=$?
          tail -6 /tmp/ctrl.txt
          echo "대조군 rc=${rc} (기대 7 = 색인 없음)"
          [ "$rc" -ne 0 ] || { echo "::error::색인이 0인데 스모크가 통과했다 — 이 지표는 색인을 안 보고 있다"; exit 1; }
          [ "$rc" -eq 7 ] || { echo "::error::rc ${rc} ≠ 7 — 색인 0 이 「색인 없음」으로 분류되지 않았다"; exit 1; }
          # 🔴 `if-no-files-found: warn` 을 믿지 않는다 — 부재가 초록으로 지나간다. 여기서 «실재»를 센다.
          [ -s /tmp/ctrl.json ] || { echo "::error::빨강에서 --out 이 안 써졌다 /tmp/ctrl.json — O-54 ⓐ 가 성립하지 않는다"; exit 1; }
          python - <<'PY'
          import json
          d = json.load(open('/tmp/ctrl.json', encoding='utf-8'))
          rows = d.get('rows') or []
          st = sorted({r['strategies'][s]['status'] for r in rows for s in r.get('strategies', {})})
          cd = sorted({r['strategies'][s].get('code') for r in rows for s in r.get('strategies', {})} - {None})
          print(f"--out 실재 · rows {len(rows)} · status {st} · code {cd}")
          PY


      # ============================ 색인 (변수는 이것 하나) ============================
      - name: build index (계수 stdout)
        run: |
          set -euo pipefail
          t0=$(date +%s)
          python services/indexer/build_index.py
          echo "색인 $(( $(date +%s) - t0 ))s"

      - name: index counts (DB 직접 질의)
        run: |
          set -euo pipefail
          approved=$(psql -tAc "SELECT count(*) FROM document_revision WHERE approval_state = 'approved'")
          chunks=$(psql -tAc "SELECT count(*) FROM document_chunk")
          embedded=$(psql -tAc "SELECT count(*) FROM document_chunk WHERE embedding IS NOT NULL")
          echo "approved revision ${approved} · chunk ${chunks} · embedding 있음 ${embedded}"
          [ "$chunks" -gt 0 ] || { echo "::error::chunk 0행 — 색인이 아무것도 안 넣었다"; exit 1; }
          [ "$embedded" = "$chunks" ] || { echo "::error::embedding 없는 chunk ${chunks}-${embedded} 건"; exit 1; }

      # ============================ 본 측정 (색인 «후») ============================
      - name: benchmark smoke (색인 후 · 계수 stdout)
        run: |
          set -euo pipefail
          node benchmarks/run-benchmark-smoke.mjs \
            --base "http://127.0.0.1:${API_PORT}" --k 5 --out benchmark-smoke.json
          echo "--- 요약 ---"
          python - <<'PY'
          import json
          d = json.load(open('benchmark-smoke.json', encoding='utf-8'))
          s = d.get('summary', d)
          print(json.dumps(s, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-smoke-result
          path: |
            benchmark-smoke.json
            /tmp/ctrl.txt
            /tmp/ctrl.json
          if-no-files-found: warn

      - name: container log
        if: always()
        run: docker logs --tail 300 fkt-bench > bench-container.log 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-smoke-container-log
          path: bench-container.log
          if-no-files-found: warn

      - name: axes this job does not cover
        if: always()
        run: |
          echo "🔴 이 job 이 안 본 축:"
          echo "  · --gate(회귀 판정선 · #852) — 주지 않는다. 이 job 은 «보고»다."
          echo "  · graphrag 전략 — neo4j 를 안 띄웠다(vector·hybrid 만)."
          echo "  · Windows — 러너는 ubuntu 뿐이다."
          echo "  · live 합성·구독 — 이 회로는 retrieval 만 부른다(합성 0 · 구독 0)."

      - name: cleanup
        if: always()
        run: docker rm -f fkt-bench || true
