# ci — 공개 경계 위생 게이트 (baseline §34.3 ci.yml의 부트스트랩 단계 구성)
# 🔴 GitHub-hosted 러너 전용(§34.4) — self-hosted 러너 등록 금지(운영자 확정 2026-08-28).
# 코드 착지 후 §34.3의 스택별 게이트(lint·typecheck·test·contract·빌드)를 이 워크플로에 추가한다.
name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: required files (baseline §34.2)
        run: |
          test -f README.md
          test -f LICENSE
          test -f docs/baseline/poc-baseline-v0.2.md

      - name: contract tests (packages/contracts ↔ tests/contract)
        run: node tests/contract/run.js --quiet --strict-coverage

      - name: public boundary scan (baseline §34.6)
        run: |
          set -e
          # 추적 파일에 env·키·크리덴셜 파일이 섞이면 실패 (.env.example = 키 목록 템플릿·값 0 — 허용, §34.6)
          if git ls-files | grep -E '(^|/)\.env(\.|$)|\.(pem|key)$|credentials|secrets' | grep -vE '(^|/)\.env\.example$'; then
            echo '::error::tracked credential-like file detected'; exit 1; fi
          # 시크릿 토큰 패턴 (이 워크플로 자신은 제외)
          # 🔴 `sk-` 축은 **하이픈을 허용한다**(D-19). 앞판은 `sk-[A-Za-z0-9]{20,}` 였고,
          #    Anthropic 키는 `sk-ant-api03-…` 라 `sk-` 바로 뒤 네 번째 글자가 하이픈이다 —
          #    20자를 세기 전에 문자군이 끊겨 **영원히 통과했다**(대조군 E1: 같은 파일에
          #    `ghp_…`+`sk-ant-…` 를 심으니 이 게이트는 `ghp_` 1건만 잡았다).
          # 🔴 하이픈만 허용하면 «평범한 영어»가 걸린다(실측 위양성 1건):
          #    `task-completed-0123456789abcdef` 의 「ta**sk-**」가 26자를 채운다. 그래서
          #    앞에 «낱말 경계»를 세운다 — `sk` 앞이 영숫자면(task·risk·ask) 매치하지 않는다.
          #    경계를 빼고 게이트에 예외를 여는 길은 택하지 않았다(예외는 곧 「내가 쓴 것 전부 허용」이 된다).
          if git grep -n -I -E '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|(^|[^A-Za-z0-9])sk-[A-Za-z0-9-]{20,}|AKIA[0-9A-Z]{16}|xox[bap]-[0-9A-Za-z-]+|BEGIN (RSA|EC|OPENSSH) PRIVATE KEY)' -- ':!.github/workflows/'; then
            echo '::error::secret-like pattern detected'; exit 1; fi
          # 개인 PC 절대 경로 패턴 (Windows 사용자 경로)
          # 🔴 구분자 «두 형태»를 다 본다(D-15). 백슬래시만 보던 앞판은 pwsh·git·문서가
          #    쓰는 `C:/Users/…` 를 영원히 통과시켰다 — 실제로 evidence 1건이 그렇게 살아 있었다.
          if git grep -n -I -E 'C:[\\/]+Users[\\/]+[A-Za-z]' -- ':!.github/workflows/'; then
            echo '::error::personal absolute path detected'; exit 1; fi

      # ── tailnet 내부 주소 (baseline §34.6 · D-20) ──────────────────────────────
      #
      # 공개 경계 문면이 말하는 「실제 Tunnel 내부 주소」의 «주소» 축이다. 앞판은 이 축을
      # 사람 눈으로만 봤고, 그래서 추적 파일에 남은 내부 주소가 스캔 1회로만 드러났다.
      #
      # 🔴 «호스트명»은 이 게이트의 대상이 아니다(D-15 에서 갈린 축이다) — 여기서는
      #    CGNAT 공유 주소 대역(RFC 6598)에 드는 «주소»만 본다. 두 축을 한 게이트에
      #    묶으면 어느 쪽이 울었는지 실패 문면이 말해 주지 못한다.
      #
      # 🔴 앞뒤에 «낱말 경계»를 둔다 — 숫자·점이 붙어 있으면 매치하지 않는다. 그래서
      #    대역을 두 옥텟으로 줄여 적는 문서 표기는 걸리지 않고(주소가 아니다),
      #    대역 밖 이웃 주소와 자릿수가 붙은 숫자도 걸리지 않는다.
      #    대조군 실측: 양성 표본 6종 전건 검출 · 음성 표본 8종 전건 통과.
      #
      # 🔴 이 파일에 «예시 주소»를 적지 않는다. 적는 순간 게이트가 자기 근거를 물고,
      #    제외 경로 하나에 기대게 된다 — 대역 이름과 RFC 번호로만 말한다.
      - name: tailnet internal address scan (baseline §34.6 · D-20)
        run: |
          set -e
          if git grep -n -I -E '(^|[^0-9.])100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}([^0-9.]|$)' -- ':!.github/workflows/'; then
            echo '::error::tailnet internal address detected'; exit 1; fi

      # ── README 전제조건 표 + 실행 발췌 ↔ 리포 실물 (「하드코딩 금지」 2026-09-02) ──────
      #
      # README 는 pnpm·Node·이미지 태그를 «값»으로 싣는다 — 문서라 그럴 수밖에 없다. 그래서
      # 낡는다: 리포가 움직여도 표는 자기가 낡은 줄 모른다. 이 step 이 그 자리를 받는다.
      #
      # 🔴 **기대값은 어디에도 박혀 있지 않다.** 검사기는 한쪽을 README 표에서 읽고, 다른 쪽을
      #    **README 가 출처로 지목한 파일**에서 읽어 맞댄다(출처 경로조차 README 가 선언한다).
      #
      # 🔴 **검사기 자기 검증을 같은 step 에서 매 실행 돌린다.** 「참 한 번」만 울리면 검사기가
      #    죽어 있을 때도 초록이 난다 — 죽은 검사기는 언제나 통과시키기 때문이다. 그래서
      #    값 하나를 일부러 틀린 사본을 만들어 **빨강이 나오는지**까지 본다. 사본을 만들지
      #    못했다면(표 문면이 바뀌어 치환이 안 먹었다면) 그것도 실패다 — 자극 없는 판정은
      #    판정이 아니다.
      #
      # 🔴 **축이 하나 늘었다 — 「▶ 실행」의 여섯 줄 발췌**(§35.6 · D-20 후속). 그 줄들은
      #    runbook 에서 «옮겨 적은» 것이라 원본이 움직여도 자기가 낡은 줄 모른다. 검사기는
      #    발췌 블록에서 명령을 읽고, **그 행이 링크로 지목한 파일의 · 링크 텍스트가 말하는
      #    절**에서 같은 줄을 찾는다 — 명령도 개수도 박혀 있지 않다.
      #    이 축의 자기 검증은 스크립트 «안»에서 돈다(정본 사본 1줄 훼손 → 빨강 · 자극 계수).
      #    추출 0건·자극 0건은 둘 다 실패다.
      - name: README 전제조건 표 + 실행 발췌 ↔ 리포 실물 대조
        run: |
          set -euo pipefail
          node scripts/check-readme-versions.mjs

          tampered="$RUNNER_TEMP/README-tampered.md"
          sed -E 's/^\| pnpm \| \*\*[^*]+\*\*/| pnpm | **0.0.0-tampered**/' README.md > "$tampered"
          if cmp -s README.md "$tampered"; then
            echo "::error::변조 사본을 만들지 못했다 — 표 문면이 바뀌어 자기 검증이 성립하지 않는다"
            exit 1
          fi
          if node scripts/check-readme-versions.mjs --readme "$tampered"; then
            echo "::error::검사기 자기 검증 실패 — 일부러 틀린 사본이 통과했다(검사기가 죽어 있다)"
            exit 1
          fi
          echo "자기 검증 OK — 참에서 초록, 변조에서 빨강"

      # ── 원장 마커 ↔ 머리글 (O-34 · 규칙 정본 `evidence/ledger-denominator-audit.md` §7) ──
      #
      # §7 검산이 마지막 줄에 남긴 이름이 이 칸이다 — 「이 검산은 «지금 값이 규칙과 맞는가»를
      # 말할 뿐 «규칙이 앞으로 지켜지는가»는 말하지 않는다. 마커 없는 행이 다시 생기면
      # 그때는 아무도 안 본다.」
      #
      # 🔴 **기대값은 어디에도 박혀 있지 않다.** 검사기는 한쪽을 원장 «머리글»에서 읽고 다른
      #    쪽을 원장 «행»에서 세어 맞댄다. 그래서 분모가 늘어도(티켓 등재) 두 축이 같이
      #    움직이면 그대로 초록이다 — 숫자를 여기 적으면 원장이 움직일 때마다 CI 를 고쳐야 하고,
      #    그 순간 정본이 둘이 된다.
      #
      # 🔴 **자기 검증을 매 실행 «두 번» 돌린다.** 죽은 검사기는 언제나 통과시킨다.
      #    ① 머리글 ✅ 수 +1 → 빨강이어야 한다.
      #    ② 티켓 행 1건의 마커 제거 → 빨강 **+ 그 행 번호를 지목**해야 한다. §7.1 이
      #       「둘째 칸이 핵심」이라 못박은 자리다 — 「마커 없는 행 0건」이 참인지 물으려면
      #       마커 없는 행을 실제로 잡을 수 있어야 하고, 그 칸이 없으면 「0건」은 **검출력 0 인
      #       초록**과 구별되지 않는다.
      #    사본을 만들지 못하는 것도 실패다(문면이 바뀌어 치환이 안 먹었다는 뜻이고,
      #    자극 없는 판정은 판정이 아니다).
      - name: 원장 마커·머리글 ↔ 행 계수 대조 (O-34)
        run: |
          set -euo pipefail
          node scripts/check-ledger-markers.mjs

          # ① 머리글 변조 — 분자가 실물과 어긋나면 빨강인가
          header="$RUNNER_TEMP/ledger-header.md"
          node scripts/check-ledger-markers.mjs --tamper-header "$header"
          if node scripts/check-ledger-markers.mjs --ledger "$header"; then
            echo "::error::검사기 자기 검증 실패 — 머리글이 어긋난 사본이 통과했다(검사기가 죽어 있다)"
            exit 1
          fi

          # ② 마커 제거 — 빨강만으로는 모자라다. «어느 행인가»를 지목해야 한다.
          nomarker="$RUNNER_TEMP/ledger-nomarker.md"
          node scripts/check-ledger-markers.mjs --tamper-marker "$nomarker" > "$RUNNER_TEMP/tamper.out"
          line="$(sed -n 's/^TAMPERED_LINE=//p' "$RUNNER_TEMP/tamper.out")"
          if [ -z "$line" ]; then
            echo "::error::무마커 사본을 만들지 못했다 — 자극 없는 판정은 판정이 아니다"
            exit 1
          fi
          if out="$(node scripts/check-ledger-markers.mjs --ledger "$nomarker" 2>&1)"; then
            echo "::error::검사기 자기 검증 실패 — 마커 없는 티켓 행이 통과했다"
            exit 1
          fi
          if ! printf '%s' "$out" | grep -q "L${line}"; then
            echo "::error::빨강은 났으나 «어긋난 행»을 지목하지 못했다(L${line} 미출력)"
            printf '%s\n' "$out"
            exit 1
          fi
          echo "자기 검증 OK — 참에서 초록 · 머리글 변조에서 빨강 · 무마커에서 빨강 + L${line} 지목"

  # O-20(09-04): tests_unit 는 파일로만 있고 부르는 회로가 없었다 — 여기가 그 회로다.
  unit-ai-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 🔴 이 목록은 `services/ai-api/tests_unit` 이 여는 import 체인의 «실측치»다
      #    (센쿠2 45대 O-20 예비 실측 09-04 23:32 · pytest+pydantic+fastapi+pydantic-settings 4개로
      #    18 passed · torch·sentence-transformers·psycopg·neo4j·numpy 부재). requirements.txt 는
      #    torch 를 실으므로 일부러 안 깐다. 체인 어딘가에 top-level `import psycopg`/torch 계열이
      #    들어오는 날 이 job 은 «테스트가 틀려서»가 아니라 «목록이 모자라서» 빨강이 된다 —
      #    그때는 목록을 늘리기 전에 체인(왜 unit 이 그 의존을 여는가)을 먼저 본다.
      - name: install (measured import chain only)
        run: python -m pip install --disable-pip-version-check --quiet pytest==9.1.1 pydantic==2.13.5 fastapi==0.141.1 pydantic-settings==2.15.0
      - name: unit tests (services/ai-api/tests_unit)
        working-directory: services/ai-api
        run: python -m pytest tests_unit -q
      # T7-42: 게이트웨이 단위도 파일로만 있고 부르는 회로가 없었다 — 여기가 그 회로다(O-20 과 같은 형태).
      # 🔴 같은 job 안에 두는 이유: 이 층은 **표준 라이브러리 + pytest 만** 연다(gateway.py 의 의존이
      #    urllib·hashlib 뿐이라 위 목록에 더 깔 것이 없다). 빨강이 났을 때 무엇이 울었는지는 **step
      #    이름**으로 갈린다 — job 을 하나 더 세우면 checkout·python 설치를 한 벌 더 치른다.
      - name: unit tests (services/synthesis-gateway/tests_unit)
        working-directory: services/synthesis-gateway
        run: python -m pytest tests_unit -q

  # web-console 의 vitest 층(39건)은 파일로만 있고 부르는 회로가 없었다 — 여기가 그 회로다.
  #
  # 🔴 hygiene 이 아니라 «별 job» 으로 둔다. hygiene 은 공개 경계 위생 게이트(§34.6)이고
  #    거기에 node 설치·의존 설치를 얹으면 경계 검사가 그만큼 늦어진다. 같은 이유로 이미
  #    `unit-ai-api` 가 따로 서 있으므로 그 형태를 따른다 — 빨강이 났을 때 «무엇이 울었는지»가
  #    job 이름으로 갈린다.
  # 🔴 **이 앱의 패키지 매니저는 pnpm 이다** — `package.json` 의 `packageManager: pnpm@…` 와
  #    추적된 `pnpm-lock.yaml` 이 정본이다. npm 으로도 설치가 «되기는» 하지만(실측: `npm ci`
  #    초록) 그 길은 `package-lock.json` 이라는 **두 번째 정본**을 만든다 — 두 lock 이 서로
  #    다른 트리를 말하기 시작하면 CI 의 초록이 개발자의 트리를 증명하지 못한다.
  # 🔴 `pnpm/action-setup` 이 `setup-node` «앞»에 온다 — `cache: pnpm` 은 store 경로를
  #    물으려고 pnpm 을 먼저 찾는다. 버전은 적지 않는다: action 이 `packageManager` 필드를
  #    읽으므로 그 필드가 유일한 출처로 남는다(여기 숫자를 박으면 출처가 둘이 된다).
  # 🔴 **`package_json_file` 을 반드시 준다.** action 의 기본값은 워크스페이스 루트의
  #    `package.json` 인데 이 리포의 루트에는 그 파일이 없다 — 실측: 기본값으로 두었더니
  #    `Error: No pnpm version is specified.` 로 7초 만에 죽었다(run 33949513119). 「필드를
  #    읽는다」는 사실만으로는 부족하고 «어느 파일의» 필드인지가 판정을 정한다.
  unit-web-console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web-console/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: apps/web-console/pnpm-lock.yaml
      - name: install (frozen lockfile — 재현성)
        working-directory: apps/web-console
        run: pnpm install --frozen-lockfile
      - name: unit tests (apps/web-console)
        working-directory: apps/web-console
        run: pnpm test:unit
